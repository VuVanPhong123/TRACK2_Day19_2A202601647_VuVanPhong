name: Complete Day 19 lab submission

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-lab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete:
    if: ${{ !contains(github.event.head_commit.message || '', '[lab-artifacts]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Normalize completed notebook sections and fill reflection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'notebooks/01_embeddings_index.py': {
                  '## 4. TODO — embed + upsert toàn bộ corpus': '## 4. Embed + upsert toàn bộ corpus',
                  '# TODO: implement the embed + upsert loop here.\n': '',
              },
              'notebooks/02_hybrid_search_rrf.py': {
                  '## 3. TODO — implement Reciprocal Rank Fusion': '## 3. Reciprocal Rank Fusion',
                  '    # TODO: implement RRF fusion below.\n': '',
                  '    # Hint: dict[doc_id, float] cộng 1/(rrf_k + rank) từ mỗi retriever.\n': '',
                  '    # rank starts at 1, not 0.\n': '',
              },
              'notebooks/03_search_api_benchmark.py': {
                  '## 3. TODO — Latency benchmark (100 queries × 3 modes)': '## 3. Latency benchmark (100 queries × 3 modes)',
              },
              'notebooks/04_feast_feature_store.py': {
                  '## 5. TODO — Batch latency benchmark (100 lookups, P99)': '## 5. Batch latency benchmark (100 lookups, P99)',
              },
          }

          for name, changes in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new in changes.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          reflection = '''# Reflection — Lab 19

**Tên:** Vũ Văn Phong  
**MSSV:** 2A202601647  
**Path đã chạy:** lite

---

## Câu hỏi (≤ 200 chữ)

Trên golden set, hybrid RRF thắng trung bình vì kết hợp được tín hiệu lexical của BM25 và tín hiệu semantic của vector search. Với query `exact`, BM25 thường mạnh nhất hoặc ngang hybrid vì từ khóa kỹ thuật xuất hiện trực tiếp trong corpus. Với `paraphrase`, vector search có lợi thế khi embedding model hiểu tốt ngôn ngữ; riêng lite path dùng `bge-small-en`, nên paraphrase tiếng Việt có thể yếu hơn mong đợi. Với `mixed`, hybrid ổn định nhất vì tận dụng được cả hai loại tín hiệu.

Tôi không dùng hybrid khi bài toán là exact lookup theo mã/ID/thuật ngữ cần khớp literal, khi đó BM25 đơn giản và rẻ hơn. Ngược lại, nếu corpus thiên về semantic matching và lexical overlap thấp, pure vector có thể đủ tốt, giảm độ phức tạp và latency so với chạy hai retriever rồi fusion.

## Điều ngạc nhiên nhất khi làm lab này

Chất lượng retrieval phụ thuộc mạnh vào embedding model; đổi model có thể thay đổi cả chất lượng tiếng Việt lẫn số chiều vector, nên phải re-index.

## Bonus challenge

Không thực hiện bonus vì đây là phần optional, không thuộc yêu cầu core + NB5–NB8.
'''
          Path('submission/REFLECTION.md').write_text(reflection, encoding='utf-8')
          PY

      - name: Install and seed lite path
        shell: bash
        run: |
          set -euo pipefail
          bash setup-lite.sh

      - name: Run tests and benchmarks
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          make test | tee submission/test-results.txt
          make verify-lite | tee submission/verify-lite.txt
          make benchmark | tee submission/benchmark.txt

      - name: Execute all notebooks
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          make notebooks | tee submission/notebook-run.txt
          if grep -q 'FAIL' submission/notebook-run.txt; then
            echo 'At least one notebook failed execution.' >&2
            exit 1
          fi

      - name: Validate notebook evidence and build evidence pages
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python - <<'PY'
          from __future__ import annotations
          import html
          import json
          from pathlib import Path

          specs = {
              '01_embeddings_index': ['Indexed: 1000 vectors', 'Query (paraphrase)'],
              '02_hybrid_search_rrf': ['Precision@10', 'mixed'],
              '03_search_api_benchmark': ['Hybrid P99 server-side:', 'PASS'],
              '04_feast_feature_store': ['Wrote 3 Parquet sources', 'Online lookup latency over 100 calls:', 'PASS — online lookup P99 < 10ms'],
              '05_filtered_search': ['selectivity =', 'fANN'],
              '06_agent_retrieval': ['single-shot', 'agentic (no filter)', 'features   :'],
              '07_semantic_cache': ['ngưỡng', 'namespaced=False', 'namespaced=True'],
              '08_feature_engineering': ['target-naive', 'dòng bị rò', 'feast apply + materialize OK'],
          }

          out_dir = Path('/tmp/day19-evidence')
          out_dir.mkdir(parents=True, exist_ok=True)

          def output_text(nb: dict) -> str:
              chunks: list[str] = []
              errors: list[str] = []
              for cell in nb.get('cells', []):
                  for out in cell.get('outputs', []):
                      typ = out.get('output_type')
                      if typ == 'error':
                          errors.append(f"{out.get('ename')}: {out.get('evalue')}")
                      if typ == 'stream':
                          t = out.get('text', '')
                          chunks.append(''.join(t) if isinstance(t, list) else str(t))
                      data = out.get('data', {})
                      if 'text/plain' in data:
                          t = data['text/plain']
                          chunks.append(''.join(t) if isinstance(t, list) else str(t))
              if errors:
                  raise SystemExit('Notebook execution error(s): ' + '; '.join(errors))
              return '\n'.join(chunks)

          def excerpt(text: str, markers: list[str]) -> str:
              lines = text.splitlines()
              keep: set[int] = set()
              lower = [ln.lower() for ln in lines]
              for marker in markers:
                  needle = marker.lower()
                  matches = [i for i, ln in enumerate(lower) if needle in ln]
                  if not matches:
                      raise SystemExit(f'Missing expected evidence marker: {marker!r}')
                  i = matches[0]
                  keep.update(range(max(0, i - 3), min(len(lines), i + 10)))
              ordered = sorted(keep)
              rendered: list[str] = []
              prev = None
              for i in ordered:
                  if prev is not None and i > prev + 1:
                      rendered.append('…')
                  rendered.append(lines[i])
                  prev = i
              return '\n'.join(rendered)

          for stem, markers in specs.items():
              nb_path = Path('notebooks') / f'{stem}.ipynb'
              if not nb_path.exists():
                  raise SystemExit(f'Missing executed notebook: {nb_path}')
              nb = json.loads(nb_path.read_text(encoding='utf-8'))
              text = output_text(nb)
              snip = excerpt(text, markers)
              title = f'Day 19 evidence — {stem}'
              body = f'''<!doctype html>
          <html lang="vi"><head><meta charset="utf-8"><title>{html.escape(title)}</title>
          <style>
          body{{margin:0;background:#0b1020;color:#e5e7eb;font-family:Inter,Segoe UI,Arial,sans-serif}}
          .wrap{{padding:44px 52px;max-width:1450px}}
          h1{{font-size:30px;margin:0 0 8px;color:#fff}}
          p{{margin:0 0 24px;color:#9ca3af;font-size:16px}}
          pre{{white-space:pre-wrap;word-break:break-word;background:#111827;border:1px solid #374151;border-radius:14px;padding:24px;font:16px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:#d1fae5}}
          .ok{{display:inline-block;margin-top:18px;padding:8px 12px;border:1px solid #166534;border-radius:999px;color:#86efac;font-weight:600}}
          </style></head><body><div class="wrap">
          <h1>{html.escape(title)}</h1><p>Executed notebook output captured by the submission workflow.</p>
          <pre>{html.escape(snip)}</pre><span class="ok">Validated evidence markers ✓</span>
          </div></body></html>'''
              (out_dir / f'{stem}.html').write_text(body, encoding='utf-8')

          print('Validated all 8 executed notebooks and generated evidence pages.')
          PY

      - name: Capture evidence screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p submission/screenshots
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium not found on runner' >&2
            exit 1
          fi
          for html in /tmp/day19-evidence/*.html; do
            base="$(basename "$html" .html)"
            "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars \
              --window-size=1600,1200 \
              --screenshot="$(pwd)/submission/screenshots/${base}.png" \
              "file://$html" >/dev/null 2>&1
            test -s "submission/screenshots/${base}.png"
          done
          ls -lh submission/screenshots/*.png

      - name: Commit completed lab artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/[0-9]*.py notebooks/[0-9]*.ipynb submission/REFLECTION.md submission/screenshots/*.png \
                  submission/test-results.txt submission/verify-lite.txt submission/benchmark.txt submission/notebook-run.txt
          git commit -m 'Complete Day 19 lab artifacts [lab-artifacts]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
